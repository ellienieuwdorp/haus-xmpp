name: HausXMPP
options:
  bundleIdPrefix: haus.xmpp
  deploymentTarget:
    iOS: '26.0'
# DEVELOPMENT_TEAM and HAUS_STAGING_DOMAIN come from here, and from the optional, gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  XMPPProtocol:
    path: Packages/XMPPProtocol
  MessageStore:
    path: Packages/MessageStore
  MessagingCore:
    path: Packages/MessagingCore
  OMEMO:
    path: Packages/OMEMO
targets:
  HausXMPP:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # The icon artwork as a plain image too, for the About screen: iOS does not load an app icon set by name.
      - path: App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
        buildPhase: resources
      # The licence and notice files, bundled as they are in the repository for Settings > About > Licences.
      - path: LICENSE
        buildPhase: resources
      - path: LICENSE-ADDITIONAL-PERMISSION
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Packages/OMEMOCrypto/NOTICE.libomemo-c
        buildPhase: resources
      - path: Packages/OMEMOCrypto/LICENSE.libomemo-c
        buildPhase: resources
      - path: Packages/OMEMOCrypto/LICENSE.protobuf-c
        buildPhase: resources
    # Merged into the generated Info.plist. Without this key Core Animation caps iPhone animations at 60 Hz.
    info:
      path: App/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Ellie Nieuwdorp and the Haus XMPP contributors
        NSCameraUsageDescription: Take a photo or video to send.
        NSMicrophoneUsageDescription: Record sound with videos you take to send.
        NSPhotoLibraryUsageDescription: Pick recent photos and videos to send.
        # The attachment panel shows its own limited-access row with a Manage menu instead of the system prompt.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # Communication notifications: the app declares the intent it donates through the extension.
        NSUserActivityTypes: [INSendMessageIntent]
        # APNs environment the push gateway sends this build's tokens to (see HAUS_PUSH_ENVIRONMENT below).
        HausPushEnvironment: $(HAUS_PUSH_ENVIRONMENT)
        # Optional test server for `-staging` (Config/Base.xcconfig). Empty in a plain checkout.
        HausStagingDomain: $(HAUS_STAGING_DOMAIN)
        # One window until AppModel can serve several; a second iPad window would share the one AppModel, open chat and
        # scenePhase handler. This is the whole manifest: the generated one (turned off below) says true and wins over a
        # partial manifest here.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    dependencies:
      - package: XMPPProtocol
      - package: MessageStore
      - package: MessagingCore
      - package: OMEMO
      - sdk: Intents.framework
      - target: XMPPNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: haus.xmpp.ios
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Haus XMPP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your local XMPP development server.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save photos you receive to your library.
        # Files dropped into the app's Documents folder show up in the Files app for attaching.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        # The Mac gets a native target; keep this iOS build off Apple silicon Macs as an untested iPad app.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
      # Debug is development-signed (App/App.entitlements says aps-environment development) and receives sandbox
      # tokens. Release is what gets archived for TestFlight/App Store, where distribution signing makes the
      # entitlement production. A Release build installed with development signing would still get sandbox tokens.
      configs:
        Debug:
          HAUS_PUSH_ENVIRONMENT: sandbox
        Release:
          HAUS_PUSH_ENVIRONMENT: production
  # The native Mac app. A separate target rather than a second destination of HausXMPP, so the iOS target's sources,
  # Info.plist and entitlements stay exactly as they were: the UIKit-only views are left out here instead of being
  # wrapped in #if, and the Mac keeps its own plist keys and sandbox entitlements.
  HausXMPPMac:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: App
        excludes:
          # The iPhone's app entry, root list, conversation screen and the UIKit views under it. The Mac has its own
          # entry, split view and conversation view in Mac/.
          - HausXMPPApp.swift
          - RootView.swift
          - ChatListView.swift
          - ConversationView.swift
          - ConversationTimeline.swift
          - ConversationSearchBar.swift
          - DateChipView.swift
          - MessageActionsOverlay.swift
          - AttachmentKeyboard.swift
          - NotificationHarness.swift
          - Info.plist
          - App.entitlements
      - Shared
      - Mac
      # Debug-only: the app arms and reads the extension's storage probe.
      - NotificationServiceMac/MacExtensionProbe.swift
      # The licence and notice files, bundled as they are in the repository for Settings > About > Licences.
      - path: LICENSE
        buildPhase: resources
      - path: LICENSE-ADDITIONAL-PERMISSION
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Packages/OMEMOCrypto/NOTICE.libomemo-c
        buildPhase: resources
      - path: Packages/OMEMOCrypto/LICENSE.libomemo-c
        buildPhase: resources
      - path: Packages/OMEMOCrypto/LICENSE.protobuf-c
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Ellie Nieuwdorp and the Haus XMPP contributors
        HausPushEnvironment: $(HAUS_PUSH_ENVIRONMENT)
        HausStagingDomain: $(HAUS_STAGING_DOMAIN)
        # Communication notifications, as on iOS: the app declares the intent its extension donates.
        NSUserActivityTypes: [INSendMessageIntent]
        # One process per user: a second copy would contend for the store's transport lease.
        LSMultipleInstancesProhibited: true
    dependencies:
      - package: XMPPProtocol
      - package: MessageStore
      - package: MessagingCore
      - package: OMEMO
      - target: XMPPNotificationServiceMac
    settings:
      base:
        PRODUCT_NAME: Haus XMPP
        PRODUCT_MODULE_NAME: HausXMPP
        PRODUCT_BUNDLE_IDENTIFIER: haus.xmpp.ios
        CODE_SIGN_ENTITLEMENTS: Mac/Mac.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Haus XMPP
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
      configs:
        Debug:
          HAUS_PUSH_ENVIRONMENT: sandbox
        Release:
          HAUS_PUSH_ENVIRONMENT: production
  XMPPNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared]
    dependencies:
      - package: MessageStore
      - package: MessagingCore
      - package: OMEMO
      - package: XMPPProtocol
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: haus.xmpp.ios.notifications
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  # The Mac's notification service extension: the iOS extension's code under the same App ID, built for macOS with the
  # sandbox entitlements a Mac extension needs. Embedded in HausXMPPMac. Its Info.plist is the iOS one plus
  # `Subsystems: [EXService_Subsystem]`: without it macOS 27 launches the extension but never hands it the request, and
  # kills it for a sluggish startup two seconds later.
  XMPPNotificationServiceMac:
    type: app-extension
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: NotificationService
        excludes:
          - NotificationService.entitlements
          - Info.plist
      - Shared
      - NotificationServiceMac
    dependencies:
      - package: MessageStore
      - package: MessagingCore
      - package: OMEMO
      - package: XMPPProtocol
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_NAME: XMPPNotificationService
        PRODUCT_MODULE_NAME: XMPPNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: haus.xmpp.ios.notifications
        CODE_SIGN_ENTITLEMENTS: NotificationServiceMac/NotificationServiceMac.entitlements
        INFOPLIST_FILE: NotificationServiceMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  HausXMPPLifecycleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppLifecycleTests
      # The 045ca73 build's schema-21 store, the f563365 build's schema-23 store and main's (4df394a) schema-24
      # store, shared with the MessageStore package tests.
      - path: Packages/MessageStore/Tests/MessageStoreTests/Fixtures/schema-21.sql
        buildPhase: resources
      - path: Packages/MessageStore/Tests/MessageStoreTests/Fixtures/schema-23.sql
        buildPhase: resources
      - path: Packages/MessageStore/Tests/MessageStoreTests/Fixtures/schema-24.sql
        buildPhase: resources
    dependencies:
      - target: HausXMPP
      - package: MessageStore
      - package: OMEMO
      - package: XMPPProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HausXMPP.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HausXMPP
        BUNDLE_LOADER: $(TEST_HOST)
  HausXMPPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: HausXMPP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HausXMPP:
    build:
      targets:
        HausXMPP: all
    test:
      targets: [HausXMPPUITests]
      # UIFull runs every UI test (once per PR); UISmoke is the three keyboard and gesture keepers to run routinely.
      # See AppTests/README.md.
      testPlans:
        - path: TestPlans/UIFull.xctestplan
          defaultPlan: true
        - path: TestPlans/UISmoke.xctestplan
  HausXMPPMac:
    build:
      targets:
        HausXMPPMac: all
    run:
      config: Debug
  HausXMPPLifecycle:
    build:
      targets:
        HausXMPP: all
    test:
      targets: [HausXMPPLifecycleTests]
      environmentVariables:
        XMPP_UI_TEST_STORE: 8EA94AB4-1CDF-4978-B3C3-BF9D6E879842
