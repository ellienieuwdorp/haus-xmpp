name: XMPPiOS
options:
  bundleIdPrefix: dev.xmpplab
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  XMPPProtocol:
    path: Packages/XMPPProtocol
  MessageStore:
    path: Packages/MessageStore
  MessagingCore:
    path: Packages/MessagingCore
  OMEMO:
    path: Packages/OMEMO
targets:
  XMPPiOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: XMPPProtocol
      - package: MessageStore
      - package: MessagingCore
      - package: OMEMO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xmpplab.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: XMPP Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your local XMPP development server.
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  XMPPiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: XMPPiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XMPPiOS:
    build:
      targets:
        XMPPiOS: all
    test:
      targets: [XMPPiOSUITests]
