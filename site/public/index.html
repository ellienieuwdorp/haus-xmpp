<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>haus xmpp</title>
<meta name="description" content="Haus XMPP, an XMPP messenger for iPhone and Mac with OMEMO encryption. Early, in testing.">
<link rel="icon" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script defer src="https://stats.wavfeed.com/wf.js" data-website-id="cd57fc09-8bad-4aa8-933a-7b2d78471280" data-domains="xmpp.haus,www.xmpp.haus"></script>
</head>
<body>
<main class="home">
  <img class="icon" src="/images/icon.png" alt="Haus XMPP app icon">
  <h1>haus xmpp</h1>
  <figure class="scene">
    <div class="stage">
      <!-- One conversation on both devices. In light mode the Mac is light and the iPhone dark;
           in dark mode they swap, so both appearances are always on the page. -->
      <picture>
        <source srcset="/images/mac-dark.webp" media="(prefers-color-scheme: dark)" type="image/webp">
        <source srcset="/images/mac-dark.png" media="(prefers-color-scheme: dark)">
        <source srcset="/images/mac-light.webp" type="image/webp">
        <img class="mac" src="/images/mac-light.png" width="840" height="585" alt="A conversation in Haus XMPP on the Mac: a chat list beside a chat with a photo, a link preview, a reply, reactions and read receipts">
      </picture>
      <picture>
        <source srcset="/images/iphone-light.jpg" media="(prefers-color-scheme: dark)">
        <img class="phone" src="/images/iphone-dark.jpg" width="598" height="1300" alt="The same conversation on iPhone, in the other appearance">
      </picture>
    </div>
  </figure>
  <a class="badge" href="https://testflight.apple.com/join/KXPB2S3p">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="currentColor" transform="translate(0 2.12)"><path id="blade" d="M12 12C10.4 8.2 10.5 3.4 12 1.5 13.5 3.4 13.6 8.2 12 12z"/><use href="#blade" transform="rotate(120 12 12)"/><use href="#blade" transform="rotate(240 12 12)"/><circle cx="12" cy="12" r="2.4"/></g></svg>
    <span><small>iPhone and Mac beta on</small> TestFlight</span>
  </a>
  <nav class="links">
    <a href="https://github.com/ellienieuwdorp/haus-xmpp">GitHub</a>
    <a href="/support/">Support</a>
    <a href="/privacy/">Privacy</a>
  </nav>
</main>
</body>
</html>
