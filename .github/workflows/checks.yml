# Static checks: Tools/check.sh full (SwiftLint and slop-check against their baselines, import boundaries, public
# hygiene), baselines that only shrink, and a secret scan. Nothing is built but the slop-check tool.
#
# Security properties, for anyone changing this file:
# - The job runs on a GitHub-hosted runner, a fresh VM per job; no job may target a self-hosted runner.
# - Pull requests, from forks too, get exactly the same job as pushes. They run with a read-only token and no secrets.
#   There is no `pull_request_target` or `workflow_run` trigger, and the workflow uses no secrets at all.
# - The token can only read the repository (`contents: read`), and checkout doesn't keep it in .git/config.
# - Actions are pinned to full commit SHAs, and downloaded tools to the SHA-256 of their release archive.
# - Event values reach shell scripts through environment variables, never by expanding `${{ }}` inside `run:`.
name: Checks

on:
  push:
    branches: [main]
  # `labeled` and `unlabeled` rerun the baseline check when a maintainer adds or removes baseline-growth-approved.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels its older run. Pushes to main each get their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    # GitHub's macOS arm64 image with Xcode 27 (https://github.com/actions/runner-images). It also carries newer betas
    # and release candidates; DEVELOPER_DIR pins the image's default, released Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      # Keep SWIFTLINT_VERSION in step with PINNED_VERSION in Tools/lint-ratchet.py.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install SwiftLint and gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/swiftlint" version
          "$RUNNER_TEMP/bin/gitleaks" version
      # A cold build of slop-check compiles swift-syntax, a few minutes. A checker change reuses the swift-syntax build
      # from the newest cache with the same Package.resolved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tools/slop-check/.build
          key: slop-check-${{ runner.os }}-${{ hashFiles('Tools/slop-check/Package.resolved') }}-${{ hashFiles('Tools/slop-check/Package.swift', 'Tools/slop-check/Sources/**', 'Tools/slop-check/Tests/**') }}
          restore-keys: slop-check-${{ runner.os }}-${{ hashFiles('Tools/slop-check/Package.resolved') }}-
      - name: Test slop-check
        # Its own scratch path: a debug build in the release build's directory makes the next release build start over.
        run: swift test --package-path Tools/slop-check --scratch-path Tools/slop-check/.build/tests
      - name: Check
        run: Tools/check.sh full
      - name: Baselines only shrink
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'baseline-growth-approved')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -I Tools/baseline-guard.py "$BASE"
      # A pull request's own commits; on main and by hand, the whole history.
      - name: Scan for secrets
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi
