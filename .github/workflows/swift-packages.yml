# Package tests on GitHub-hosted runners. Lab tests (suites named `…LabTests`) skip themselves here: they need a live
# test server. UI tests don't run in CI.
#
# Security properties, for anyone changing this file:
# - Every job runs on a GitHub-hosted runner, a fresh VM per job; no job may target a self-hosted runner.
# - Pull requests, from forks too, get exactly the same jobs as pushes. They run with a read-only token and no secrets.
#   There is no `pull_request_target` or `workflow_run` trigger, and the workflow uses no secrets at all.
# - The token can only read the repository (`contents: read`), and checkout doesn't keep it in .git/config.
# - Actions are pinned to full commit SHAs.
# - Event values reach shell scripts through environment variables, never by expanding `${{ }}` inside `run:`.
name: Swift packages

# A run starts only when a package or this CI changed, and tests only the changed packages and the packages that depend
# on them. Run it by hand to test every package.
on:
  push:
    branches: [main]
    paths: ['Packages/**', '.github/workflows/swift-packages.yml', '.github/scripts/changed-packages.sh']
  pull_request:
    paths: ['Packages/**', '.github/workflows/swift-packages.yml', '.github/scripts/changed-packages.sh']
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels its older run: the pull request's diff against its base covers both. Pushes
# to main never cancel each other, since each one tests only the packages its own commits changed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick packages
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          packages=$(.github/scripts/changed-packages.sh "$EVENT" "$SINCE")
          echo "packages=$packages" | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    # GitHub's macOS arm64 image with Xcode 27 (https://github.com/actions/runner-images). It also carries newer betas
    # and release candidates; DEVELOPER_DIR pins the image's default, released Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify vendored libomemo-c and protobuf-c
        if: matrix.package == 'OMEMOCrypto'
        run: python3 -I Packages/OMEMOCrypto/Scripts/verify_vendor.py
      - name: Test
        run: swift test --package-path "Packages/$PACKAGE" --parallel
